name: Go Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    env:
      # Reuse the prover build for the CLI and the Go FFI tests.
      CARGO_TARGET_DIR: ${{ github.workspace }}/go-zkvm/host-ffi/target

    steps:
      - name: Checkout go-zkvm
        uses: actions/checkout@v5
        with:
          path: go-zkvm

      - name: Checkout RISC Zero v3.1.0 Go release
        uses: actions/checkout@v5
        with:
          repository: Roasbeef/risc0
          path: risc0
          ref: 2da8bf6dff33cbb6e148d5f3b9b639929a582d7c

      - name: Fetch proving circuits
        working-directory: risc0
        run: git lfs pull --include='risc0/circuit/*/src/zkrs.tar.xz'

      - name: Checkout tinygo-zkvm sibling
        uses: actions/checkout@v5
        with:
          repository: Roasbeef/tinygo-zkvm
          ref: 3a9a23f2679af76883390e73f6f362d6785e829e
          path: tinygo-zkvm
          submodules: recursive
          token: ${{ secrets.ROASBEEF_CI_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.4"
          cache-dependency-path: go-zkvm/go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            go-zkvm/go-guest-host
            go-zkvm/host-core
            go-zkvm/host-ffi
            risc0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake \
            ninja-build \
            python3

      - name: Install RISC Zero guest Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://risczero.com/install | bash
          "$HOME/.risc0/bin/rzup" install rust 1.97.0

      - name: Restore TinyGo LLVM source cache
        uses: actions/cache/restore@v4
        id: tinygo-llvm-source
        with:
          key: tinygo-llvm-source-20-linux-v1
          path: |
            tinygo-zkvm/llvm-project/clang/lib/Headers
            tinygo-zkvm/llvm-project/clang/include
            tinygo-zkvm/llvm-project/compiler-rt
            tinygo-zkvm/llvm-project/lld/include
            tinygo-zkvm/llvm-project/llvm/include

      - name: Download TinyGo LLVM source
        if: steps.tinygo-llvm-source.outputs.cache-hit != 'true'
        working-directory: tinygo-zkvm
        run: make llvm-source

      - name: Save TinyGo LLVM source cache
        uses: actions/cache/save@v4
        if: steps.tinygo-llvm-source.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.tinygo-llvm-source.outputs.cache-primary-key }}
          path: |
            tinygo-zkvm/llvm-project/clang/lib/Headers
            tinygo-zkvm/llvm-project/clang/include
            tinygo-zkvm/llvm-project/compiler-rt
            tinygo-zkvm/llvm-project/lld/include
            tinygo-zkvm/llvm-project/llvm/include

      - name: Restore TinyGo LLVM build cache
        uses: actions/cache/restore@v4
        id: tinygo-llvm-build
        with:
          key: tinygo-llvm-build-20-linux-v1
          path: tinygo-zkvm/llvm-build

      - name: Build TinyGo LLVM
        if: steps.tinygo-llvm-build.outputs.cache-hit != 'true'
        working-directory: tinygo-zkvm
        run: |
          make llvm-source
          make llvm-build
          find llvm-build -name CMakeFiles -prune -exec rm -r '{}' \;

      - name: Save TinyGo LLVM build cache
        uses: actions/cache/save@v4
        if: steps.tinygo-llvm-build.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.tinygo-llvm-build.outputs.cache-primary-key }}
          path: tinygo-zkvm/llvm-build

      - name: Build TinyGo
        working-directory: tinygo-zkvm
        run: make tinygo

      - name: Build guest prerequisites
        working-directory: go-zkvm
        run: |
          make platform-standalone
          make host-ffi
          make simple

      - name: fmt-check
        working-directory: go-zkvm
        run: make fmt-check

      - name: lint-native
        working-directory: go-zkvm
        run: make lint-native

      - name: Prove and verify the sample guests
        working-directory: go-zkvm
        run: make verify-samples

      - name: native-check
        working-directory: go-zkvm
        run: make native-check
